app-id: com.openai.chatgpt
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: chatgpt
tags:
  - proprietary
separate-locales: false

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/gtk-doc
  - '*.la'

finish-args:
  # Display & Windowing
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Networking
  - --share=network
  # Audio & Media
  - --socket=pulseaudio
  # Hardware Acceleration
  - --device=dri
  # Filesystem permissions
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  - --filesystem=home
  # Desktop Integration & Notifications
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  # Environment
  - --env=OZONE_PLATFORM=wayland

modules:
  - name: chatgpt
    buildsystem: simple
    build-options:
      no-debuginfo: true
      strip: false
    build-commands:
      # 1. 部署主程序本体
      - mkdir -p /app/lib/chatgpt /app/bin
      - |
        echo "=== Locating ChatGPT package files ==="
        echo "Current directory: $(pwd)"
        ls -la
        if [ -d "extracted/usr/lib/chatgpt" ]; then
          SRC_DIR="extracted/usr/lib/chatgpt"
        elif [ -d "extracted/lib/chatgpt" ]; then
          SRC_DIR="extracted/lib/chatgpt"
        elif [ -d "usr/lib/chatgpt" ]; then
          SRC_DIR="usr/lib/chatgpt"
        elif [ -d "lib/chatgpt" ]; then
          SRC_DIR="lib/chatgpt"
        else
          SRC_DIR=$(find . -maxdepth 4 -type d -name "chatgpt" -not -path "*/icons/*" | head -n 1)
        fi
        echo "Source directory resolved to: ${SRC_DIR}"
        if [ -n "${SRC_DIR}" ] && [ -d "${SRC_DIR}" ]; then
          cp -a "${SRC_DIR}"/* /app/lib/chatgpt/
        else
          echo "ERROR: Failed to find chatgpt files!"
          find . -maxdepth 4
          exit 1
        fi

      # 2. 确保主程序及组件具备执行权限
      - chmod +x /app/lib/chatgpt/ChatGPT
      - chmod +x /app/lib/chatgpt/resources/codex || true

      # 3. 安装启动脚本
      - install -Dm755 chatgpt.sh /app/bin/chatgpt

      # 4. 安装桌面图标与 AppStream 元数据
      - install -Dm644 com.openai.chatgpt.desktop /app/share/applications/com.openai.chatgpt.desktop
      - install -Dm644 com.openai.chatgpt.metainfo.xml /app/share/metainfo/com.openai.chatgpt.metainfo.xml

      # 5. 安装标准 Hicolor 多尺寸图标
      - |
        for size in 16 24 32 48 64 128 256 512; do
          if [ -f "icons/hicolor/${size}x${size}/apps/com.openai.chatgpt.png" ]; then
            install -Dm644 "icons/hicolor/${size}x${size}/apps/com.openai.chatgpt.png" \
              "/app/share/icons/hicolor/${size}x${size}/apps/com.openai.chatgpt.png"
          fi
        done

      # 6. 修补 codex 二进制 (兼容 Flatpak 沙箱挂载与自定义 bwrap 垫片)
      - python3 patch-codex.py /app/lib/chatgpt/resources/codex

      # 7. 编译安装 Flatpak 环境下的 bwrap 适配垫片
      - gcc -O2 bwrap_shim.c -o /app/bin/bwrap
      - chmod +x /app/bin/bwrap
      - mkdir -p /app/lib/chatgpt/resources/codex-resources
      - cp /app/bin/bwrap /app/lib/chatgpt/resources/codex-resources/bwrap
      - cp /app/bin/bwrap /app/lib/chatgpt/resources/bwrap
      - chmod +x /app/lib/chatgpt/resources/codex-resources/bwrap /app/lib/chatgpt/resources/bwrap

    sources:
      - type: archive
        url: https://persistent.oaistatic.com/codex-app-prod/linux/rpm/x86_64/chatgpt-26.1023.51421-1.x86_64.rpm
        sha256: dfc857b549c68a90900ef7eebae93a1d89c09c7cb634dd260b2b17c0bd3ee562
        dest: extracted
        only-arches:
          - x86_64

      - type: file
        path: chatgpt.sh

      - type: file
        path: com.openai.chatgpt.desktop

      - type: file
        path: com.openai.chatgpt.metainfo.xml

      - type: file
        path: bwrap_shim.c

      - type: file
        path: scripts/patch-codex.py
        dest-filename: patch-codex.py

      - type: dir
        path: icons
        dest: icons
