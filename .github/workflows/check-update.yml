name: Check Upstream Updates

on:
  schedule:
    - cron: '0 */6 * * *' # Run every 6 hours
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  check-update:
    name: Check & Update Manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Update Checker
        id: check
        run: |
          python3 scripts/update-checker.py --ci --update

      - name: Commit and Push Manifest Changes
        if: steps.check.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add com.openai.chatgpt.yaml com.openai.chatgpt.metainfo.xml
          git commit -m "chore(release): bump ChatGPT to ${{ steps.check.outputs.version }} (release ${{ steps.check.outputs.release }})"
          git push origin master
