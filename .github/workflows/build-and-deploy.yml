name: Build Flatpak & Deploy Repository

on:
  push:
    branches:
      - master
    paths:
      - 'com.openai.chatgpt.yaml'
      - 'chatgpt.sh'
      - 'com.openai.chatgpt.desktop'
      - 'com.openai.chatgpt.metainfo.xml'
      - 'bwrap_shim.c'
      - 'scripts/**'
      - 'icons/**'
      - 'web/**'
      - 'chatgpt.flatpakref'
      - 'chatgpt.flatpakrepo'
      - '.github/workflows/build-and-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Only one deployment at a time; queued runs keep the newest, so an older
# build can never overwrite a newer one.
concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build Flatpak & Export Repository
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    outputs:
      app_version: ${{ steps.get_version.outputs.app_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract Application Version
        id: get_version
        run: |
          VERSION=$(grep -oP 'chatgpt-\K[0-9.]+(?=-)' com.openai.chatgpt.yaml | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to extract version from com.openai.chatgpt.yaml"
            exit 1
          fi
          echo "app_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building ChatGPT version: ${VERSION}"

      - name: Install Runtime Dependencies
        run: |
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.electronjs.Electron2.BaseApp//25.08 || true

      - name: Build Flatpak Package & OSTree Repo
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: com.openai.chatgpt.yaml
          bundle: com.openai.chatgpt.flatpak
          build-bundle: true
          branch: stable
          repo-dir: repo
          cache: true
          arch: x86_64

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ] || [ -z "$GPG_KEY_ID" ]; then
            echo "::error::Secrets GPG_PRIVATE_KEY / GPG_KEY_ID are required to sign the repository"
            exit 1
          fi
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG "$GPG_KEY_ID"

      - name: Sign Repository & Generate Static Deltas
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          scripts/sign-repo.sh repo "$GPG_KEY_ID"
          tar -czf ostree-repo.tar.gz -C repo .

      - name: Upload Standalone Bundle
        uses: actions/upload-artifact@v7
        with:
          name: chatgpt-bundle
          path: com.openai.chatgpt.flatpak
          if-no-files-found: error

      - name: Upload OSTree Repository Archive
        uses: actions/upload-artifact@v7
        with:
          name: ostree-repo-archive
          path: ostree-repo.tar.gz
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages & Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      APP_VERSION: ${{ needs.build.outputs.app_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Standalone Bundle
        uses: actions/download-artifact@v8
        with:
          name: chatgpt-bundle

      - name: Download OSTree Repository Archive
        uses: actions/download-artifact@v8
        with:
          name: ostree-repo-archive

      - name: Move release tag to the built commit
        run: |
          # softprops/action-gh-release does not move an existing tag on a same-version repackage
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "v${APP_VERSION}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/v${APP_VERSION}"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          name: "ChatGPT Desktop v${{ env.APP_VERSION }}"
          draft: false
          prerelease: false
          files: |
            com.openai.chatgpt.flatpak
            ostree-repo.tar.gz
            chatgpt.flatpakref
            chatgpt.flatpakrepo
          body: |
            ## ChatGPT Desktop v${{ env.APP_VERSION }}

            Unofficial Flatpak package of the ChatGPT Linux desktop client from OpenAI.

            ### Installation

            #### Option 1: standalone bundle
            Download `com.openai.chatgpt.flatpak` from the assets below, then run:
            ```bash
            flatpak install --user com.openai.chatgpt.flatpak
            ```

            #### Option 2: `.flatpakref`
            Download `chatgpt.flatpakref` from the assets below, then double-click it or run:
            ```bash
            flatpak install chatgpt.flatpakref
            ```

            #### Option 3: add the repository (receives updates through `flatpak update`)
            ```bash
            flatpak remote-add --if-not-exists chatgpt https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/chatgpt.flatpakrepo
            flatpak install chatgpt com.openai.chatgpt
            flatpak run com.openai.chatgpt
            ```

            ---
            Built and published by GitHub Actions.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Deployment Directory
        run: |
          # Web site plus the full OSTree repository, published through the Actions Pages API
          mkdir -p deploy/repo deploy/icons
          tar -xzf ostree-repo.tar.gz -C deploy/repo/
          cp -a web/* deploy/
          cp -a icons/hicolor/512x512/apps/com.openai.chatgpt.png deploy/icons/com.openai.chatgpt.png
          cp -a icons/hicolor/512x512/apps/com.openai.chatgpt.png deploy/icons/512x512.png
          cp chatgpt.flatpakrepo chatgpt.flatpakref deploy/
          cp chatgpt.flatpakrepo chatgpt.flatpakref deploy/repo/
          touch deploy/.nojekyll

      - name: Upload Pages Artifact (Including Full OSTree Repository)
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./deploy

      - name: Deploy to GitHub Pages (Actions Environment)
        id: deployment
        uses: actions/deploy-pages@v5
